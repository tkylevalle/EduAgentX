name: Sprint 1 tests and grading validity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sprint1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The runner installs all components before cross-service tests execute.
      - name: Run Sprint 1 technical checks and record release gate
        run: python3 scripts/run-sprint1.py --technical-only

      - name: Upload Sprint 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-test-evidence
          path: evidence/runs
          if-no-files-found: warn

  # The production grader measured on the real exam items, with labels from
  # people and whole-attempt validity probes (assurance audit A2-A4, E1).
  # It fails while the status is Red, so a green build cannot hide an
  # invalid grader.
  grading-validity:
    runs-on: ubuntu-latest
    # Same budget as the Sprint 1 job: installing every component dominates,
    # and a timeout must not fail the job for the wrong reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install component dependencies
        run: node scripts/install-dependencies.js

      # Fails if the behaviour sandbox passes a known-bad agent or fails the
      # safe one (assurance audit A8, A9).
      - name: Run the behaviour panel
        run: node packages/agent-sandbox/cli.js --write --strict

      - name: Measure grading validity
        # Runs even when the panel step failed, so both results are reported.
        if: always()
        run: node packages/grading-validity/cli.js --write --strict

      - name: Upload grading validity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-validity-report
          path: |
            artifacts/grading-validity/report.json
            artifacts/agent-sandbox/panel-report.json
          if-no-files-found: warn
