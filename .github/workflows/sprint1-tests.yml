name: Sprint 1 tests and grading validity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sprint1-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The runner installs all components before cross-service tests execute.
      - name: Run Sprint 1 technical checks and record release gate
        run: python3 scripts/run-sprint1.py --technical-only

      - name: Upload Sprint 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sprint1-test-evidence
          path: evidence/runs
          if-no-files-found: warn

  # Measures the production grader against people's labels; fails while the status is Red.
  grading-validity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install component dependencies
        run: node scripts/install-dependencies.js

      # Fails if the sandbox passes a known-bad agent or fails the safe one.
      - name: Run the behaviour panel
        run: node packages/agent-sandbox/cli.js --write --strict

      - name: Measure grading validity
        # Runs even when the panel step failed, so both results are reported.
        if: always()
        run: node packages/grading-validity/cli.js --write --strict

      - name: Upload grading validity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grading-validity-report
          path: |
            artifacts/grading-validity/report.json
            artifacts/agent-sandbox/panel-report.json
          if-no-files-found: warn
