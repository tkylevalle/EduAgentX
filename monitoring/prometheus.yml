global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway:4000/health
          - http://agent-registry:4001/health
          - http://curriculum-engine:4002/health
          - http://curriculum-index:4003/health
          - http://training-service:4004/health
          - http://validation-activation:4010/health
          - http://assurance-console:4100/health
          - http://synthetic-agent-learner:4200/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: health-prober:9115
