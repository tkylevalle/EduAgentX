name: eduagentx

networks:
  eduagentx-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chromadb-data:
  curriculum-index-cache:

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduagentx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?Run node scripts/setup-dev.js}
      CURRICULUM_DB_PASSWORD: ${CURRICULUM_DB_PASSWORD:?Run node scripts/setup-dev.js}
      TRAINING_DB_PASSWORD: ${TRAINING_DB_PASSWORD:?Run node scripts/setup-dev.js}
      EXAMINATION_DB_PASSWORD: ${EXAMINATION_DB_PASSWORD:?Run node scripts/setup-dev.js}
      CERTIFICATION_DB_PASSWORD: ${CERTIFICATION_DB_PASSWORD:?Run node scripts/setup-dev.js}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Idempotent role migration for checkouts with an existing Sprint 2 volume;
  # PostgreSQL init scripts run only when the volume is first created.
  examination-db-init:
    image: postgres:16-alpine
    container_name: eduagentx-examination-db-init
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      EXAMINATION_DB_PASSWORD: ${EXAMINATION_DB_PASSWORD:?Run node scripts/setup-dev.js}
    volumes:
      - ./db/init/005_examination_role.sh:/tmp/005_examination_role.sh:ro
    command: ["sh", "/tmp/005_examination_role.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduagentx-net

  certification-db-init:
    image: postgres:16-alpine
    container_name: eduagentx-certification-db-init
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      CERTIFICATION_DB_PASSWORD: ${CERTIFICATION_DB_PASSWORD:?Run node scripts/setup-dev.js}
    volumes:
      - ./db/init/006_certification_role.sh:/tmp/006_certification_role.sh:ro
    command: ["sh", "/tmp/006_certification_role.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eduagentx-net

  redis:
    image: redis:7-alpine
    container_name: eduagentx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  agent-registry:
    build:
      context: .
      dockerfile: services/agent-registry/Dockerfile
    container_name: eduagentx-agent-registry
    environment:
      PORT: 4001
      DATABASE_URL: postgres://registry_owner:${REGISTRY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: agent-registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  curriculum-engine:
    build:
      context: .
      dockerfile: services/curriculum-engine/Dockerfile
    container_name: eduagentx-curriculum-engine
    environment:
      PORT: 4002
      DATABASE_URL: postgres://curriculum_owner:${CURRICULUM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  chromadb:
    image: ghcr.io/chroma-core/chroma:1.5.9
    container_name: eduagentx-chromadb
    environment:
      IS_PERSISTENT: "TRUE"
    volumes:
      - chromadb-data:/chroma/chroma/
    ports:
      - "127.0.0.1:${CHROMADB_PORT:-8000}:8000"
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  curriculum-index:
    build:
      context: .
      dockerfile: services/curriculum-index/Dockerfile
    container_name: eduagentx-curriculum-index
    environment:
      PORT: 4003
      DATABASE_URL: postgres://curriculum_owner:${CURRICULUM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      INDEX_SNAPSHOT_PATH: /app/services/curriculum-index/data/last-index-snapshot.json
    volumes:
      - curriculum-index-cache:/app/services/curriculum-index/data
    depends_on:
      postgres:
        condition: service_healthy
      curriculum-engine:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  training-service:
    build:
      context: .
      dockerfile: services/training-service/Dockerfile
    container_name: eduagentx-training-service
    environment:
      PORT: 4004
      DATABASE_URL: postgres://training_owner:${TRAINING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TRAINING_INTERNAL_KEY: ${TRAINING_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      VALIDATION_ACTIVATION_URL: http://validation-activation:4010
      AGENT_REGISTRY_URL: http://agent-registry:4001
      TRAINING_MIN_PRACTICE_PER_MODULE: ${TRAINING_MIN_PRACTICE_PER_MODULE:-1}
      TRAINING_MAX_RESPONSE_CHARS: ${TRAINING_MAX_RESPONSE_CHARS:-4000}
      TRAINING_SESSION_TIMEOUT_MINUTES: ${TRAINING_SESSION_TIMEOUT_MINUTES:-1440}
      # The completion relay. Training starts without Redis; events wait in the outbox.
      REDIS_URL: redis://redis:6379
      TRAINING_COMPLETION_STREAM: ${TRAINING_COMPLETION_STREAM:-training.session.completed}
    depends_on:
      postgres:
        condition: service_healthy
      validation-activation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4004/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  examination-engine:
    build:
      context: .
      dockerfile: services/examination-engine/Dockerfile
    container_name: eduagentx-examination-engine
    environment:
      PORT: 4005
      DATABASE_URL: postgres://examination_owner:${EXAMINATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EXAMINATION_INTERNAL_KEY: ${EXAMINATION_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      EXAMINATION_GRADING_KEY: ${EXAMINATION_GRADING_KEY:?Run node scripts/setup-dev.js}
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      TRAINING_INTERNAL_KEY: ${TRAINING_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      EXAM_DURATION_MINUTES: ${EXAM_DURATION_MINUTES:-60}
      VALIDATION_ACTIVATION_URL: http://validation-activation:4010
      AGENT_REGISTRY_URL: http://agent-registry:4001
      TRAINING_SERVICE_URL: http://training-service:4004
      GRADING_SERVICE_URL: http://grading-service:4020
      GRADING_SERVICE_KEY: ${GRADING_SERVICE_KEY:?Run node scripts/setup-dev.js}
    depends_on:
      postgres:
        condition: service_healthy
      examination-db-init:
        condition: service_completed_successfully
      training-service:
        condition: service_healthy
      validation-activation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: eduagentx-api-gateway
    environment:
      PORT: 4000
      AGENT_REGISTRY_URL: http://agent-registry:4001
      CURRICULUM_ENGINE_URL: http://curriculum-engine:4002
      VALIDATION_ACTIVATION_URL: http://validation-activation:4010
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      TRAINING_SERVICE_URL: http://training-service:4004
      TRAINING_INTERNAL_KEY: ${TRAINING_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      EXAMINATION_ENGINE_URL: http://examination-engine:4005
      EXAMINATION_INTERNAL_KEY: ${EXAMINATION_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      SERVICE_NAME: api-gateway
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      AGENT_CLIENT_ID: ${AGENT_CLIENT_ID}
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET}
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
      REVIEWER_1_CLIENT_ID: ${REVIEWER_1_CLIENT_ID:-}
      REVIEWER_1_CLIENT_SECRET: ${REVIEWER_1_CLIENT_SECRET:-}
      REVIEWER_2_CLIENT_ID: ${REVIEWER_2_CLIENT_ID:-}
      REVIEWER_2_CLIENT_SECRET: ${REVIEWER_2_CLIENT_SECRET:-}
      GOVERNANCE_CLIENT_ID: ${GOVERNANCE_CLIENT_ID:-}
      GOVERNANCE_CLIENT_SECRET: ${GOVERNANCE_CLIENT_SECRET:-}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:4000"
    depends_on:
      agent-registry:
        condition: service_healthy
      curriculum-engine:
        condition: service_healthy
      training-service:
        condition: service_healthy
      examination-engine:
        condition: service_healthy
      validation-activation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  certification-service:
    build:
      context: .
      dockerfile: services/certification-service/Dockerfile
    container_name: eduagentx-certification-service
    environment:
      PORT: 4011
      DATABASE_URL: postgres://certification_owner:${CERTIFICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CERTIFICATION_INTERNAL_KEY: ${CERTIFICATION_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      CERTIFICATION_KEY_ID: ${CERTIFICATION_KEY_ID:-https://eduagentx.example/issuers/eduagentx#dev-ed25519-1}
      CERTIFICATION_PRIVATE_KEY_PATH: ${CERTIFICATION_PRIVATE_KEY_PATH:-/app/keys/certification-ed25519-private.pem}
      CERTIFICATION_ISSUER: ${CERTIFICATION_ISSUER:-https://eduagentx.example/issuers/eduagentx}
      CREDENTIAL_BASE_URL: ${CREDENTIAL_BASE_URL:-https://eduagentx.example/credentials}
      CERTIFICATION_SWEEP_INTERVAL_MS: ${CERTIFICATION_SWEEP_INTERVAL_MS:-1000}
      EXAMINATION_ENGINE_URL: http://examination-engine:4005
      EXAMINATION_INTERNAL_KEY: ${EXAMINATION_INTERNAL_KEY:?Run node scripts/setup-dev.js}
      VALIDATION_ACTIVATION_URL: http://validation-activation:4010
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      certification-db-init:
        condition: service_completed_successfully
      examination-engine:
        condition: service_healthy
      validation-activation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4011/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  synthetic-agent-learner:
    build:
      context: .
      dockerfile: services/synthetic-agent-learner/Dockerfile
    container_name: eduagentx-synthetic-agent-learner
    environment:
      PORT: 4200
      API_GATEWAY_URL: http://api-gateway:4000
      SERVICE_NAME: synthetic-agent-learner
      AGENT_CLIENT_ID: ${AGENT_CLIENT_ID}
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${SYNTHETIC_AGENT_PORT:-4200}:4200"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4200/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  assurance-console:
    build:
      context: .
      dockerfile: services/assurance-console/Dockerfile
    container_name: eduagentx-assurance-console
    environment:
      PORT: 4100
      API_GATEWAY_URL: http://api-gateway:4000
      SERVICE_NAME: assurance-console
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-4173}:4100"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  health-prober:
    image: prom/blackbox-exporter:v0.27.0
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - eduagentx-net


  validation-activation:
    build:
      context: .
      dockerfile: services/validation-activation/Dockerfile
    container_name: eduagentx-validation-activation
    environment:
      PORT: 4010
      SERVICE_NAME: validation-activation
      DATABASE_URL: postgres://curriculum_owner:${CURRICULUM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CURRICULUM_INTERNAL_KEY: ${CURRICULUM_INTERNAL_KEY:?Run node scripts/setup-dev.js}
    ports:
      - "127.0.0.1:${VALIDATION_ACTIVATION_PORT:-4010}:4010"
    depends_on:
      postgres:
        condition: service_healthy
      curriculum-engine:
        condition: service_healthy
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  grading-service:
    build:
      context: ./services/grading-service
    container_name: eduagentx-grading-service
    environment:
      PORT: 4020
      SERVICE_NAME: grading-service
      GRADING_SERVICE_KEY: ${GRADING_SERVICE_KEY:?Run node scripts/setup-dev.js}
    ports:
      - "127.0.0.1:${GRADING_SERVICE_PORT:-4020}:4020"
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4020/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  credential-verification:
    build:
      context: ./services/credential-verification
    container_name: eduagentx-credential-verification
    environment:
      PORT: 4030
      SERVICE_NAME: credential-verification
      CREDENTIAL_ISSUER: did:example:eduagentx-dev-2026
      CREDENTIAL_PUBLIC_KEY_PATH: /keys/dev-public.pem
    ports:
      - "4030:4030"
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4030/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  monitoring-service:
    build:
      context: ./services/monitoring-service
    container_name: eduagentx-monitoring-service
    environment:
      PORT: 4040
      SERVICE_NAME: monitoring-service
    ports:
      - "4040:4040"
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4040/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  evidence-bundle:
    build:
      context: ./services/evidence-bundle
    container_name: eduagentx-evidence-bundle
    environment:
      PORT: 4050
      SERVICE_NAME: evidence-bundle
    ports:
      - "4050:4050"
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4050/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: eduagentx-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - eduagentx-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  grafana:
    image: grafana/grafana:12.1.1
    container_name: eduagentx-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run node scripts/setup-dev.js}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - eduagentx-net
    deploy:
